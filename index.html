<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower of London and PSIQ Experiment</title>

  <!-- jsPsych 7.3.3 -->
  <script src="https://unpkg.com/jspsych@7.3.3"></script>
  <link rel="stylesheet" href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css">

  <!-- jsPsych plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>

  <style>
    body {
      font-family: Verdana, sans-serif;
      text-align: center;
    }

    .instructions {
      max-width: 760px;
      margin: 0 auto;
      text-align: left;
    }

    .test-notice {
      max-width: 700px;
      margin: 15px auto;
      padding: 16px;
      background: #DBFFF7;
      border: 2px solid #004637;
      border-radius: 8px;
      color: #1B520E;
      box-sizing: border-box;
    }

    .test-notice h3 {
      margin-top: 0;
    }

    .test-notice .move-limit {
      font-size: 22px;
      font-weight: bold;
      margin: 12px 0;
    }

    .boards-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 34px;
      flex-wrap: wrap;
      margin: 22px auto;
      max-width: 900px;
    }

    .board-panel {
      width: min(100%, 390px);
    }

    .board-panel h3 {
      margin-bottom: 8px;
    }

    .board {
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      gap: 8px;
      min-height: 260px;
      padding: 12px 8px 30px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      box-sizing: border-box;
    }

    .peg {
      position: relative;
      width: 30%;
      min-width: 75px;
      height: 220px;
      border-bottom: 5px solid #555;
      box-sizing: border-box;
    }

    .rod {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      background: #777;
      border-radius: 5px 5px 0 0;
      pointer-events: none;
    }

    .peg-label {
      position: absolute;
      bottom: -26px;
      left: 0;
      width: 100%;
      font-weight: bold;
      pointer-events: none;
    }

    .ball {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 38px;
      border-radius: 50%;
      color: #000;
      font-weight: bold;
      font-size: 15px;
      border: 2px solid rgba(0,0,0,.18);
      cursor: pointer;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      box-sizing: border-box;
    }

    .ball.selected {
      outline: 4px solid #222;
      outline-offset: 2px;
    }

    .ball:disabled {
      cursor: default;
      opacity: 1;
    }

    #status {
      min-height: 28px;
      margin: 8px auto;
      font-weight: bold;
      color: #8a2d22;
    }

    #stats {
      margin: 10px 0;
      font-size: 17px;
      line-height: 1.8;
    }

    #finish-round {
      margin: 8px;
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .capacity-note {
      font-size: 13px;
      color: #555;
      margin-top: 6px;
    }

    .timer-box {
      margin: 15px auto;
      padding: 12px;
      background: #fff3cd;
      border: 2px solid #e0a800;
      border-radius: 8px;
      max-width: 400px;
      box-sizing: border-box;
    }

    .timer-label {
      font-size: 16px;
      font-weight: bold;
    }

    #time-remaining {
      font-size: 36px;
      font-weight: bold;
      color: #8a2d22;
    }

    .timer-warning {
      color: #dc2626 !important;
    }

    /* PSIQ questionnaire */

    .psiq-container {
      max-width: 1000px;
      margin: auto;
      text-align: left;
      padding: 10px;
    }

    .psiq-section {
      margin: 25px 0;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .psiq-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .psiq-item:last-child {
      border-bottom: none;
    }

    .psiq-question {
      flex: 1 1 220px;
      font-size: 16px;
    }

    .psiq-scale {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .psiq-scale label {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
      min-width: 22px;
    }

    .psiq-scale input {
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .boards-wrap {
        gap: 12px;
      }

      .board-panel {
        width: 100%;
      }

      .board {
        min-height: 235px;
      }

      .peg {
        min-width: 65px;
        height: 195px;
      }

      .ball {
        width: 42px;
        height: 34px;
      }

      .psiq-item {
        display: block;
      }

      .psiq-scale {
        margin-top: 10px;
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>

<div id="experiment"></div>

<script>
"use strict";
const GOOGLE_SCRIPT_URL =
  "PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE";
// =========================================================
// SETTINGS
// =========================================================

const PEGS = ["A", "B", "C"];

const CAPACITY = {
  A: 3,
  B: 2,
  C: 1
};

const BALL_COLORS = {
  1: "#FFFB00",
  2: "#0084FF",
  3: "#FF0000"
};

let participantId = "";
let demographicResponses = {};
let psiqResponses = {};


// =========================================================
// TOWER OF LONDON ROUNDS
// =========================================================

// PRACTICE ROUND

const testRound = {
  id: "TOL_test",
  start: { A: [1], B: [2], C: [3] },
  goal: { A: [1, 2, 3], B: [], C: [] },
  maxMoves: 2,
  timeLimit: 45
};


// NINE EXPERIMENTAL ROUNDS
// EDIT maxMoves AND timeLimit INDEPENDENTLY.

const rounds = [

  {
    id: "TOL_01",
    start: { A: [3, 1], B: [2], C: [] },
    goal: { A: [2], B: [1, 3], C: [] },
    maxMoves: 4,
    timeLimit: 45
  },

  {
    id: "TOL_02",
    start: { A: [], B: [3, 2], C: [1] },
    goal: { A: [3], B: [1], C: [2] },
    maxMoves: 4,
    timeLimit: 45
  },

  {
    id: "TOL_03",
    start: { A: [1], B: [2, 3], C: [] },
    goal: { A: [3, 2, 1], B: [], C: [] },
    maxMoves: 4,
    timeLimit: 45
  },

  {
    id: "TOL_04",
    start: { A: [3, 2], B: [1], C: [] },
    goal: { A: [2, 1, 3], B: [], C: [] },
    maxMoves: 5,
    timeLimit: 60
  },

  {
    id: "TOL_05",
    start: { A: [2, 3], B: [1], C: [] },
    goal: { A: [1, 3], B: [], C: [2] },
    maxMoves: 5,
    timeLimit: 60
  },

  {
    id: "TOL_06",
    start: { A: [3, 2], B: [], C: [1] },
    goal: { A: [2, 1, 3], B: [], C: [] },
    maxMoves: 5,
    timeLimit: 60
  },

  {
    id: "TOL_07",
    start: { A: [2, 3], B: [1], C: [] },
    goal: { A: [1, 2, 3], B: [], C: [] },
    maxMoves: 6,
    timeLimit: 60
  },

  {
    id: "TOL_08",
    start: { A: [3, 1], B: [2], C: [] },
    goal: { A: [1, 2], B: [3], C: [] },
    maxMoves: 6,
    timeLimit: 60
  },

  {
    id: "TOL_09",
    start: { A: [1], B: [3], C: [2] },
    goal: { A: [2], B: [1], C: [3] },
    maxMoves: 6,
    timeLimit: 60
  }

];


// =========================================================
// PSIQ QUESTIONNAIRE
// =========================================================

const psiqSections = [

  {
    name: "appearance",
    title: "Imagine the appearance of:",
    items: [
      "a friend you know well",
      "a cat climbing a tree",
      "a bonfire",
      "the front door of your house"
    ]
  },

  {
    name: "sound",
    title: "Imagine the sound of:",
    items: [
      "an ambulance siren",
      "hands clapping in applause",
      "the mewing of a cat",
      "the sound of a car horn",
      "the sound of children playing"
    ]
  },

  {
    name: "smell",
    title: "Imagine the smell of:",
    items: [
      "a stuffy room",
      "a rose",
      "fresh paint",
      "newly cut grass",
      "burning wood"
    ]
  },

  {
    name: "taste",
    title: "Imagine the taste of:",
    items: [
      "mustard",
      "soft towel",
      "lemon",
      "sea water",
      "black pepper"
    ]
  },

  {
    name: "touch",
    title: "Imagine touching:",
    items: [
      "warm sand",
      "a soft towel",
      "the point of a pin",
      "icy water",
      "fur"
    ]
  },

  {
    name: "bodily_sensation",
    title: "Imagine the bodily sensation of:",
    items: [
      "relaxing in a warm bath",
      "having a sore throat",
      "threading a needle",
      "jumping into a swimming pool",
      "walking briskly in the cold"
    ]
  },

  {
    name: "feeling",
    title: "Imagine feeling:",
    items: [
      "excited",
      "relieved",
      "furious",
      "in love",
      "scared"
    ]
  }

];


// =========================================================
// BUILD PSIQ QUESTIONNAIRE HTML
// =========================================================

let psiqHTML = `

<div class="psiq-container">

  <h2 style="text-align:center;">
    Psi-Q: The Plymouth Sensory Imagery Questionnaire
  </h2>

  <p>
    Please try to form the images described below and rate
    each mental image on the following scale:
  </p>

  <p style="text-align:center;font-weight:bold;">
    0 (no image at all) to 10 (image as clear and vivid as real life)
  </p>

  <p>
    Select one number for every item. Please answer all items.
  </p>

`;

psiqSections.forEach(section => {

  psiqHTML += `
    <div class="psiq-section">
      <h3>${section.title}</h3>
  `;

  section.items.forEach((item, index) => {

    const questionName = `${section.name}_${index + 1}`;

    psiqHTML += `
      <div class="psiq-item">

        <div class="psiq-question">
          ${item}
        </div>

        <div class="psiq-scale">
    `;

    for (let score = 0; score <= 10; score++) {

      psiqHTML += `
        <label>
          ${score}
          <input
            type="radio"
            name="${questionName}"
            value="${score}"
          >
        </label>
      `;

    }

    psiqHTML += `
        </div>
      </div>
    `;

  });

  psiqHTML += `</div>`;

});

psiqHTML += `

  <p style="font-size:13px;color:#555;">
    
  </p>

</div>

`;


// =========================================================
// INITIALIZE jsPsych
// =========================================================


const jsPsych = initJsPsych({

  display_element: "experiment",

  on_finish: function() {

    // =========================================
    // 1. SAVE LOCAL CSV BACKUP
    // =========================================

    jsPsych.data.get().localSave(
      "csv",
      "tower_of_london_and_psiq_data.csv"
    );


    // =========================================
    // 2. COLLECT ALL EXPERIMENT DATA
    // =========================================

    const allData = jsPsych.data.get().values();


    // =========================================
    // 3. GET PARTICIPANT ID
    // =========================================

    const participantTrial = allData.find(
      trial => trial.participant_id
    );

    const participantId =
      participantTrial?.participant_id || "";


    if (!participantId) {

      console.error("Participant ID is missing.");

      return;

    }


    // =========================================
    // 4. GET DEMOGRAPHIC INFORMATION
    // =========================================

    const demographicTrial = allData.find(
      trial => trial.task === "demographics"
    );

    const demographics = {

      age:
        demographicTrial?.age ??
        demographicTrial?.response?.age ?? "",

      gender:
        demographicTrial?.gender ??
        demographicTrial?.response?.gender ?? "",

      education:
        demographicTrial?.education ??
        demographicTrial?.response?.education ?? ""

    };


    // =========================================
    // 5. PREPARE ALL EXPERIMENT TRIALS
    // =========================================

    const trials = allData.map((trial, index) => {

      return {

        ...trial,

        participant_id: participantId,

        trial_index:
          trial.trial_index ?? index,

        trial_type:
          trial.trial_type || trial.type || "",

        round_id:
          trial.round_id || "",

        termination_reason:
          trial.termination_reason || ""

      };

    });


    // =========================================
    // 6. CREATE PAYLOAD FOR GOOGLE SHEETS
    // =========================================

    const payload = {

      participantId: participantId,

      demographics: demographics,

      trials: trials

    };


    // =========================================
    // 7. SEND DATA TO GOOGLE APPS SCRIPT
    // =========================================

    fetch(GOOGLE_SCRIPT_URL, {

      method: "POST",

      mode: "no-cors",

      headers: {

        "Content-Type": "text/plain;charset=utf-8"

      },

      body: JSON.stringify(payload),

      keepalive: true

    })

    .then(() => {

      console.log(
        "Experiment data submission initiated."
      );

    })

    .catch(error => {

      console.error(
        "Google Sheets submission failed:",
        error
      );

    });

  }

});


const timeline = [];


// =========================================================
// 1. DEMOGRAPHIC QUESTIONNAIRE
// =========================================================

timeline.push({

  type: jsPsychSurveyText,

  preamble: `

    <div class="instructions">

      <h2>Demographic Questionnaire</h2>

      <p>
        Please provide the following demographic information.
      </p>

    </div>

  `,

  questions: [

    {
      prompt: "Age (in years):",
      name: "age",
      required: true,
      placeholder: "Enter your age"
    },

    {
      prompt: "Gender:",
      name: "gender",
      required: true,
      placeholder: "Enter your answer or prefer not to say"
    },

    {
      prompt: "Highest level of education completed:",
      name: "education",
      required: true,
      placeholder: "Enter your answer"
    }

  ],

  button_label: "Continue",

  on_finish: function(data) {

    demographicResponses = data.response || {};

    data.task = "demographics";

    Object.assign(data, demographicResponses);

  }

});


// =========================================================
// 2. UNIQUE PARTICIPANT ID
// =========================================================

timeline.push({

  type: jsPsychSurveyText,

  preamble: `

    <div class="instructions">

      <h2>Participant Identification</h2>

      <p>
        Please enter your unique participant identification code.
      </p>

      <p>
        Make sure you enter the identification code provided
        to you by the researcher.
      </p>

    </div>

  `,

  questions: [

    {
      prompt: "Unique Participant ID:",
      name: "participant_id",
      required: true,
      placeholder: "Enter your participant ID"
    }

  ],

  button_label: "Continue",

  on_finish: function(data) {

    const response = data.response || {};

    participantId = String(
      response.participant_id || ""
    ).trim();

    data.participant_id = participantId;

  }

});


// =========================================================
// 3. TOWER OF LONDON INSTRUCTIONS
// =========================================================

timeline.push({

  type: jsPsychHtmlButtonResponse,

  stimulus: `

    <div class="instructions">

      <h2>Tower of London task</h2>

      <p>
        In each round, you will see a starting arrangement
        and a goal arrangement. Your task is to make the
        arrangement on the upper part of the screen match
        the goal on the bottom part.
      </p>

      <ul>

        <li>
          Click the top ball on a peg to select it.
        </li>

        <li>
          Then click the peg where you want to place that ball.
        </li>

        <li>
          You can move only one ball at a time.
        </li>

        <li>
          A ball can be placed on top of any other ball.
        </li>

        <li>
          Pegs have different capacities:
          Peg A holds up to 3 balls, B up to 2, and C up to 1.
        </li>

        <li>
          A peg cannot hold more balls than its capacity.
        </li>

        <li>
          If you click the selected ball's peg again,
          the selection is cancelled.
        </li>

        <li>
          Each round has its own maximum number of moves.
        </li>

        <li>
          Each round also has its own time limit.
          The countdown timer will be clearly displayed.
        </li>

        <li>
          If you reach the maximum number of moves,
          the round will end automatically.
        </li>

        <li>
          If the time limit expires before you solve the task,
          the round will automatically end and you will
          proceed to the next round.
        </li>

        <li>
          When the upper board matches the goal board,
          the round ends automatically.
        </li>

      </ul>

      <p>
        You will first complete one practice round.
        This is followed by nine actual experiment rounds.
      </p>

      <p>
        Please try to complete each task as accurately and
        quickly as possible.
      </p>

    </div>

  `,

  choices: ["Start"]

});


// =========================================================
// HELPER FUNCTIONS
// =========================================================

function clonePegs(pegs) {

  return {
    A: [...pegs.A],
    B: [...pegs.B],
    C: [...pegs.C]
  };

}


function sameArrangement(a, b) {

  return PEGS.every(peg =>

    a[peg].length === b[peg].length &&

    a[peg].every((ball, index) =>
      ball === b[peg][index]
    )

  );

}


// =========================================================
// DRAW THE BOARD
// =========================================================

function renderBoard(
  boardElement,
  pegState,
  isGoal,
  selected,
  onSelectBall,
  onSelectPeg
) {

  boardElement.innerHTML = "";

  PEGS.forEach(pegName => {

    const pegEl = document.createElement("div");

    pegEl.className = "peg";

    pegEl.dataset.peg = pegName;

    const rod = document.createElement("div");

    rod.className = "rod";

    rod.style.height =
      (CAPACITY[pegName] * 48 + 16) + "px";

    pegEl.appendChild(rod);


    pegState[pegName].forEach((ballNumber, index) => {

      const ball = document.createElement("button");

      ball.type = "button";

      ball.className = "ball" + (

        !isGoal &&
        selected &&
        selected.peg === pegName &&
        selected.ball === ballNumber

          ? " selected"
          : ""

      );

      ball.textContent = ballNumber;

      ball.style.backgroundColor = BALL_COLORS[ballNumber];

      ball.style.bottom = (index * 42 + 3) + "px";

      ball.setAttribute(
        "aria-label",
        "Ball " + ballNumber + " on peg " + pegName
      );

      const isTop =
        index === pegState[pegName].length - 1;

      if (isGoal || !isTop) {

        ball.disabled = true;

      } else {

        ball.addEventListener("click", function(event) {

          event.stopPropagation();

          onSelectBall(pegName, ballNumber);

        });

      }

      pegEl.appendChild(ball);

    });


    const label = document.createElement("div");

    label.className = "peg-label";

    label.textContent =
      pegName + " (max " + CAPACITY[pegName] + ")";

    pegEl.appendChild(label);


    if (!isGoal) {

      pegEl.addEventListener("click", function() {

        onSelectPeg(pegName);

      });

      pegEl.style.cursor = "pointer";

    }

    boardElement.appendChild(pegEl);

  });

}


// =========================================================
// 4. CREATE PRACTICE ROUND AND EXPERIMENTAL ROUNDS
// =========================================================

const allProblems = [testRound, ...rounds];


allProblems.forEach((problem, roundIndex) => {

  const isTestRound = roundIndex === 0;

  const actualRoundNumber = roundIndex;

  if (
    !Number.isInteger(problem.maxMoves) ||
    problem.maxMoves < 1
  ) {
    throw new Error(
      "Invalid maxMoves for round: " + problem.id
    );
  }

  if (
    !Number.isInteger(problem.timeLimit) ||
    problem.timeLimit < 1
  ) {
    throw new Error(
      "Invalid timeLimit for round: " + problem.id
    );
  }


  timeline.push({

    type: jsPsychHtmlButtonResponse,

    stimulus: `

      ${
        isTestRound

        ? `

          <h2 style="color:#5555aa;">
            TEST ROUND – PRACTICE ONLY
          </h2>

          <div class="test-notice">

            <h3>Practice Round</h3>

            <p>
              This is a practice round to help you become
              familiar with the task.
            </p>

            <p class="move-limit">
              Maximum moves allowed: ${problem.maxMoves}
            </p>

            <p class="move-limit">
              Maximum time allowed: ${problem.timeLimit} seconds
            </p>

            <p>
              After completing this practice round,
              you will proceed to the actual experiment.
            </p>

          </div>

        `

        : `

          <h2>
            Experiment Round ${actualRoundNumber}
            of ${rounds.length}
          </h2>

        `
      }


      <div id="stats">

        Moves:
        <span id="move-count">0</span>

        &nbsp; | &nbsp;

        Maximum moves:
        ${problem.maxMoves}

        &nbsp; | &nbsp;

        Remaining moves:
        <span id="remaining-moves">${problem.maxMoves}</span>

        <div class="timer-box">

          <div class="timer-label">
            MAXIMUM TIME ALLOWED
          </div>

          <div>
            <span id="time-remaining">
              ${problem.timeLimit}
            </span>
            <span style="font-size:22px;">seconds</span>
          </div>

          <div style="font-size:13px;">
            This round will automatically end when time expires.
          </div>

        </div>

        Elapsed time:
        <span id="elapsed-time">0</span> seconds

      </div>


      <div class="boards-wrap">

        <div class="board-panel">

          <h3>Your arrangement</h3>

          <div id="start-board" class="board"></div>

          <div class="capacity-note">
            Move the balls on this board.
          </div>

        </div>


        <div class="board-panel">

          <h3>Goal arrangement</h3>

          <div id="goal-board" class="board"></div>

          <div class="capacity-note">
            Match this arrangement exactly.
          </div>

        </div>

      </div>


      <div id="status" aria-live="polite">
        Select the top ball, then select a destination peg.
      </div>


      <button id="finish-round" type="button">
        End this round
      </button>

    `,


    choices: [],


    data: {

      task: "tower_of_london",

      round_id: problem.id,

      round_number: roundIndex + 1,

      is_test_round: isTestRound,

      actual_experiment_round:
        isTestRound ? null : actualRoundNumber,

      max_moves_allowed: problem.maxMoves,

      time_limit_seconds: problem.timeLimit

    },


    // =====================================================
    // LOAD ROUND
    // =====================================================

    on_load: function() {

      let pegs = clonePegs(problem.start);

      const goal = clonePegs(problem.goal);

      let selected = null;

      let moves = 0;

      let finished = false;

      const moveLog = [];

      const startTime = Date.now();

      let intervalId = null;


      const startBoard =
        document.getElementById("start-board");

      const goalBoard =
        document.getElementById("goal-board");

      const statusEl =
        document.getElementById("status");

      const moveCountEl =
        document.getElementById("move-count");

      const remainingMovesEl =
        document.getElementById("remaining-moves");

      const elapsedTimeEl =
        document.getElementById("elapsed-time");

      const timeRemainingEl =
        document.getElementById("time-remaining");

      const finishButton =
        document.getElementById("finish-round");


      // ===================================================
      // TIMER
      // ===================================================

      function elapsedSeconds() {

        return Math.floor(
          (Date.now() - startTime) / 1000
        );

      }


      function updateTime() {

        if (finished) return;

        const elapsed = elapsedSeconds();

        const remaining = Math.max(
          0,
          problem.timeLimit - elapsed
        );

        elapsedTimeEl.textContent = elapsed;

        timeRemainingEl.textContent = remaining;


        // Visual warning when 10 seconds or less remain.

        if (remaining <= 10) {

          timeRemainingEl.classList.add("timer-warning");

        }


        // AUTOMATIC TIMEOUT

        if (remaining <= 0) {

          statusEl.textContent =
            "Time limit reached. Proceeding to the next round.";

          finishRound(
            false,
            "time_limit_reached"
          );

        }

      }


      // ===================================================
      // DRAW BOTH BOARDS
      // ===================================================

      function draw() {

        renderBoard(

          startBoard,

          pegs,

          false,

          selected,


          // SELECT A BALL

          function(pegName, ballNumber) {

            if (finished) return;

            selected = {

              peg: pegName,

              ball: ballNumber

            };

            statusEl.textContent =
              "Ball selected. Now click a destination peg.";

            draw();

          },


          // SELECT DESTINATION PEG

          function(destination) {

            if (finished || selected === null) return;


            // Cancel selection if the same peg is clicked.

            if (destination === selected.peg) {

              selected = null;

              statusEl.textContent =
                "Selection cancelled.";

              draw();

              return;

            }


            // Check peg capacity.

            if (
              pegs[destination].length >=
              CAPACITY[destination]
            ) {

              statusEl.textContent =
                "That peg is full. Choose a peg with free space.";

              return;

            }


            const source = selected.peg;

            const ballNumber =
              pegs[source][pegs[source].length - 1];


            if (ballNumber !== selected.ball) {

              selected = null;

              draw();

              return;

            }


            // MAKE THE MOVE

            pegs[source].pop();

            pegs[destination].push(ballNumber);

            moves += 1;


            // RECORD MOVE INFORMATION

            moveLog.push({

              move_number: moves,

              ball: ballNumber,

              from_peg: source,

              to_peg: destination,

              elapsed_seconds: elapsedSeconds(),

              arrangement_after_move: JSON.stringify(pegs)

            });


            selected = null;

            moveCountEl.textContent = moves;

            remainingMovesEl.textContent = Math.max(
              0,
              problem.maxMoves - moves
            );

            statusEl.textContent = "";

            draw();


            // CHECK WHETHER GOAL HAS BEEN REACHED.

            if (sameArrangement(pegs, goal)) {

              statusEl.textContent =
                "Correct! You completed this round.";

              finishRound(true);

              return;

            }


            // CHECK MOVE LIMIT.

            if (moves >= problem.maxMoves) {

              statusEl.textContent =
                "Maximum number of moves reached. Moving to the next round.";

              finishRound(
                false,
                "maximum_moves_reached"
              );

              return;

            }

          }

        );


        // DRAW GOAL BOARD

        renderBoard(

          goalBoard,

          goal,

          true,

          null,

          null,

          null

        );

      }


      // ===================================================
      // FINISH ROUND
      // ===================================================

      function finishRound(
        solved,
        forcedReason = null
      ) {

        if (finished) return;

        finished = true;


        if (intervalId !== null) {

          clearInterval(intervalId);

        }


        finishButton.disabled = true;


        let terminationReason;


        if (forcedReason) {

          terminationReason = forcedReason;

        } else if (solved) {

          terminationReason = "solved";

        } else if (moves >= problem.maxMoves) {

          terminationReason = "maximum_moves_reached";

        } else {

          terminationReason = "participant_ended";

        }


        // PREPARE ROUND RESULTS

        const result = {

          task: "tower_of_london",

          participant_id: participantId,

          ...demographicResponses,

          round_id: problem.id,

          round_number: roundIndex + 1,

          is_test_round: isTestRound,

          actual_experiment_round:
            isTestRound ? null : actualRoundNumber,

          moves: moves,

          max_moves_allowed: problem.maxMoves,

          time_limit_seconds: problem.timeLimit,

          remaining_moves: Math.max(
            0,
            problem.maxMoves - moves
          ),

          time_seconds: elapsedSeconds(),

          solved: solved,

          termination_reason: terminationReason,

          start_state: JSON.stringify(problem.start),

          goal_state: JSON.stringify(goal),

          final_state: JSON.stringify(pegs),

          move_log: JSON.stringify(moveLog)

        };


        // END CURRENT ROUND AND MOVE TO NEXT TRIAL

        jsPsych.finishTrial(result);

      }


      // ===================================================
      // MANUAL END ROUND BUTTON
      // ===================================================

      finishButton.addEventListener("click", function() {

        finishRound(
          false,
          "participant_ended"
        );

      });


      // ===================================================
      // START ROUND
      // ===================================================

      draw();

      updateTime();

      intervalId = setInterval(
        updateTime,
        250
      );

    }

  });

});


// =========================================================
// 5. PSIQ QUESTIONNAIRE AFTER ALL TOWER OF LONDON ROUNDS
// =========================================================

const psiqTrial = {

  type: jsPsychHtmlButtonResponse,

  stimulus: psiqHTML,

  choices: ["Submit questionnaire"],


  on_load: function() {

    const submitButton = document.querySelector(
      "#jspsych-html-button-response-btngroup button"
    );

    if (!submitButton) {

      console.error(
        "PSIQ submit button could not be found."
      );

      return;

    }


    // VALIDATE ALL 35 RESPONSES

    submitButton.addEventListener(

      "click",

      function(event) {

        const unanswered = [];


        psiqSections.forEach(section => {

          section.items.forEach((item, index) => {

            const questionName =
              `${section.name}_${index + 1}`;

            const selected = document.querySelector(
              `input[name="${questionName}"]:checked`
            );

            if (!selected) {

              unanswered.push(questionName);

            }

          });

        });


        if (unanswered.length > 0) {

          event.preventDefault();

          event.stopImmediatePropagation();

          alert(
            "Please answer every question before submitting."
          );

          return;

        }


        // COLLECT ALL RESPONSES

        psiqResponses = {};


        psiqSections.forEach(section => {

          section.items.forEach((item, index) => {

            const questionName =
              `${section.name}_${index + 1}`;

            const selected = document.querySelector(
              `input[name="${questionName}"]:checked`
            );

            psiqResponses[questionName] =
              Number(selected.value);

          });

        });

      },

      true

    );

  },


  // =====================================================
  // CALCULATE PSIQ SCORES
  // =====================================================

  on_finish: function(data) {

    data.task = "PSIQ";

    data.participant_id = participantId;

    Object.assign(
      data,
      demographicResponses
    );

    data.psiq_responses = psiqResponses;

    // STORE EACH RESPONSE AS A SEPARATE CSV COLUMN

    Object.assign(
      data,
      psiqResponses
    );


    // CALCULATE SUBSCALE MEANS

    psiqSections.forEach(section => {

      const values = section.items.map(
        (item, index) => {

          return psiqResponses[
            `${section.name}_${index + 1}`
          ];

        }
      );


      const mean = values.length

        ? values.reduce(
            (sum, value) => sum + value,
            0
          ) / values.length

        : null;


      data[`${section.name}_mean`] = mean;

    });


    // CALCULATE OVERALL MEAN

    const allScores = Object.values(psiqResponses);

    data.psiq_overall_mean =
      allScores.length === 35

        ? allScores.reduce(
            (sum, value) => sum + value,
            0
          ) / allScores.length

        : null;

  }

};


timeline.push(psiqTrial);


// =========================================================
// 6. FINAL THANK-YOU SCREEN
// =========================================================

timeline.push({

  type: jsPsychHtmlButtonResponse,

  stimulus: `

    <h2>Thank you!</h2>

    <p>
      You have completed the Tower of London task
      and the questionnaire.
    </p>

    <p>
      Click Finish to complete the experiment.
    </p>

  `,

  choices: ["Finish"]

});


// =========================================================
// 7. RUN EXPERIMENT
// =========================================================

jsPsych.run(timeline);

</script>
